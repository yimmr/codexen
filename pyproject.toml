[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codexen"
version = "0.3.0"
description = "Secure MCP Bridge Engine for Remote AI Agents and Local Development"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "yimmr" }
]
dependencies = [
    "mcp-server-core>=0.7.0",
    "mcp>=1.2.0,<2",
    "PyYAML>=6.0.1",
    "ruamel.yaml>=0.18.0",
    "python-dotenv>=1.0.1",
    "starlette>=0.36.0",
    "uvicorn>=0.27.0",
    "pystray>=0.19.5",
    "pywin32>=306; platform_system=='Windows'",
    "pillow>=10.0.0",
    "pathspec>=1.1,<2",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
codexen = "codexen.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["codexen*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP"]
ignore = ["E501", "B008", "E402", "W293"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841", "B017", "I001"]
"tray_app.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"



