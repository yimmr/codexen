# ==============================================================================
# Codexen 开发项目配置文件模板 (Projects Configuration Example)
#
# 使用方式:
#   复制本文件为 config.yaml:
#     cp config.example.yaml config.yaml
#
# 安全提示:
#   config.yaml 已被 .gitignore 忽略，您在本地挂载的任何真实工程路径均绝不会被 Git 提交泄露。
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 统一工程工作区根目录
# 外部 Agent 通过 create_project 新建的项目将统一存放在此目录下并自动映射
# ------------------------------------------------------------------------------
workspace:
  root: "D:\\works"
  allow_create_project: true

# ------------------------------------------------------------------------------
# 2. 项目名称与本机真实物理根目录映射
# 外部 Agent 通过 project_id / project_name 访问，无需暴露真实绝对路径
# ------------------------------------------------------------------------------
projects:
  example:
    root: "D:\\works\\example"
    description: "示例开发工程代码库"
    read_only: false
    # 项目自定义忽略规则（可选，遵循 .gitignore 行语法，支持列表或多行文本；优先级高于全局兜底）
    # 取消注释后生效；不配置时，若项目根也没有 .gitignore，则使用全局 permissions.ignored_patterns
    # ignored_patterns:
    #   - "target/"
    #   - "dist/"
    #   - "*.log"
    #   - "!important.log"

# ------------------------------------------------------------------------------
# 3. 远程 Agent 开发操作权限与命令控制 (可选)
# ------------------------------------------------------------------------------
permissions:
  allow_file_read: true       # 允许远程 Agent 读取文件
  allow_file_write: true      # 允许远程 Agent 写入与创建文件
  allow_file_delete: true     # 允许远程 Agent 删除文件
  allow_copy_path: true       # 允许项目内与跨项目文件/目录复制
  allow_zip_operations: true  # 允许 ZIP 打包与解压
  allow_command_execution: true # 允许受控终端命令执行
  max_read_chars: 1000000     # 单次读文件最大字符限制 (防大文件内存溢出)
  max_list_entries: 1000      # 遍历目录最大条目数
  max_search_results: 200     # 代码检索单次最多返回匹配数
  max_zip_size_bytes: 104857600 # 最大允许解压/打包 ZIP 大小 (100MB)
  command_timeout_seconds: 60 # 命令执行默认硬超时时间 (秒)
  max_command_timeout_seconds: 300 # 允许设定的最大执行超时 (秒)
  max_command_output_chars: 50000  # 输出内容截断上限 (字符数，现代 Agent 最佳截断标准)
  default_encoding: "utf-8"

  # 常用开发套件白名单（允许直接执行）
  command_whitelist:
  - "git"
  - "pytest"
  - "python"
  - "py"
  - "node"
  - "npm"
  - "pnpm"
  - "yarn"
  - "cargo"
  - "rustc"
  - "go"
  - "make"
  - "ruff"
  - "flake8"
  - "tsc"
  - "pip"
  - "poetry"
  - "uv"
  - "dir"
  - "echo"
  - "type"
  - "cat"
  - "findstr"
  - "grep"

  # 高危破坏性指令硬黑名单（绝对禁止执行，即使确认也阻断）
  command_blacklist:
  - "format"
  - "diskpart"
  - "mklink"
  - "reg"
  - "regedit"
  - "shutdown"
  - "bcdedit"
  - "vssadmin"
  - "cipher"
  - "takeown"

  # 敏感指令列表（执行前需 Agent 询问用户，用户同意并传入 confirmed=True 后方可执行）
  command_require_confirmation:
  - "rmdir"
  - "del"
  - "rm"
  - "git push"
  - "git reset --hard"
  - "git clean"
  - "npm publish"
  - "pip install --upgrade"

  ignored_patterns:
  - ".git"
  - ".svn"
  - ".hg"
  - "__pycache__"
  - ".pytest_cache"
  - ".ruff_cache"
  - ".mypy_cache"
  - ".venv"
  - "venv"
  - "node_modules"
  - ".pnpm"
  - ".pnpm-store"
  - "target"
  - "dist"
  - "build"
  - "out"
  - "bin"
  - "obj"
  - ".next"
  - ".nuxt"
  - ".output"
  - ".tmp"
  - "tmp"
  - "temp"
  - ".idea"
  - ".vscode"
  - "*.pyc"
  - "*.pyo"
  - "*.pyd"
  - "*.lock"
  - "package-lock.json"
  - "pnpm-lock.yaml"
  - "yarn.lock"
  - "uv.lock"
  - "Cargo.lock"
  - "*.map"
  - "*.min.js"
  - "*.min.css"

# ------------------------------------------------------------------------------
# 4. 可观测性与日志分流配置 (mcp-server-core 0.7.0 可选)
# 默认严格收敛于 <project_root>/.runtime/logs/，不污染操作系统全局环境
# ------------------------------------------------------------------------------
logging:
  level: "INFO"               # 日志级别: DEBUG, INFO, WARNING, ERROR
  dir: ".runtime/logs"        # 日志存放子目录 (相对项目根目录)
  allow_outside_base: false   # 限制日志严格收敛于项目根目录下 (防越权写入)
  filenames:
    app: "codexen.log"        # 业务工具执行流日志文件名
    access: "access.log"      # HTTP/网络访问流日志文件名
    error: "error.log"        # 异常与堆栈流日志文件名
  max_bytes: 10485760         # 单文件轮转大小上限 (10MB)
  backup_count: 5             # 历史归档保留份数
  enable_console: true        # 是否在控制台同步打印

